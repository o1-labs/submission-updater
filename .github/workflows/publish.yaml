name: Publish

on:
  # push:
  #   tags:
  #   - '*'
  workflow_dispatch:
    inputs:
      docker_tag_prefix:
        description: "Enter the Docker Tag Prefix (e.g adhoc-test)"
        required: true
        type: string
      mina_version:
        description: 'Mina release to take mina-delegation-verify and the network config from (deb version, e.g. 4.0.2-84b8d96)'
        required: true
      mina_network:
        description: 'Network config deb to install (mina-<network>-config)'
        required: true
        default: 'mainnet'
      ledger_config_version:
        description: 'Version of mina-<network>-config that ships the ledger tarballs (empty = mina_version)'
        required: false
        default: ''
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKER_TAG_PREFIX: ${{ github.event.inputs.docker_tag_prefix }}
  MINA_VERSION: ${{ github.event.inputs.mina_version }}
  MINA_NETWORK: ${{ github.event.inputs.mina_network }}
  LEDGER_CONFIG_VERSION: ${{ github.event.inputs.ledger_config_version }}

# This allows a subsequently queued workflow run to interrupt previous runs
concurrency:
  group: '${{ github.workflow }} @ ${{ github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  build-docker-image:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: 🏷️ Generate Tag and Image Name
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            PREFIX=${{ env.DOCKER_TAG_PREFIX }}
          elif [ "${{ github.event_name }}" == "push" ] && [ -n "${{ github.event.ref }}" ]; then
            PREFIX=$(basename ${{ github.ref }})
          else
            echo "Invalid event. Exiting..."
            exit 1
          fi
          echo "TAG=$PREFIX-$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_ENV
          # Convert repository name to lowercase for Docker registry compatibility
          echo "IMAGE_NAME_LOWER=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - name: 🔑 Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 🔍 Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}
          tags: |
            type=raw,value=${{ env.TAG }}
      - name: 📦 Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: 🛠️ Build Docker Image
        run: |
          TAG=${{ env.TAG }}
          # MINA_VERSION, MINA_NETWORK and LEDGER_CONFIG_VERSION come from the workflow-level env.
          IMAGE_NAME=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}
          nix-shell --run "make docker-delegation-verify"
      - name: 🚚 Push Docker Image
        run: docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:${{ env.TAG }}
