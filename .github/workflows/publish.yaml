name: Publish

on:
  # push:
  #   tags:
  #   - '*'
  workflow_dispatch:
    inputs:
      docker_tag_prefix:
        description: "Enter the Docker Tag Prefix (e.g adhoc-test)"
        required: true
        type: string
      mina_branch:
        description: 'Branch of MinaProtocol/mina to build from'
        required: true
        default: 'delegation_verify_over_stdin_rc_base'
      dune_profile:
        description: 'Dune profile to build with'
        required: true
        default: 'devnet'
      mina_branch_post_fork:
        description: 'Branch of MinaProtocol/mina to build the post-hard-fork binary from (empty = single-binary image)'
        required: false
        default: ''
      dune_profile_post_fork:
        description: 'Dune profile to build the post-hard-fork binary with (empty = same as dune_profile)'
        required: false
        default: ''
      fork_cutover_time:
        description: 'RFC3339 hard-fork cutover time baked into the image (empty = dual mode off)'
        required: false
        default: ''
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKER_TAG_PREFIX: ${{ github.event.inputs.docker_tag_prefix }}
  MINA_BRANCH: ${{ github.event.inputs.mina_branch }}
  DUNE_PROFILE: ${{ github.event.inputs.dune_profile }}
  MINA_BRANCH_POST_FORK: ${{ github.event.inputs.mina_branch_post_fork }}
  DUNE_PROFILE_POST_FORK: ${{ github.event.inputs.dune_profile_post_fork }}
  FORK_CUTOVER_TIME: ${{ github.event.inputs.fork_cutover_time }}

# This allows a subsequently queued workflow run to interrupt previous runs
concurrency:
  group: '${{ github.workflow }} @ ${{ github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  build-docker-image:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: 🏷️ Generate Tag and Image Name
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            PREFIX=${{ env.DOCKER_TAG_PREFIX }}
          elif [ "${{ github.event_name }}" == "push" ] && [ -n "${{ github.event.ref }}" ]; then
            PREFIX=$(basename ${{ github.ref }})
          else
            echo "Invalid event. Exiting..."
            exit 1
          fi
          echo "TAG=$PREFIX-$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_ENV
          # Convert repository name to lowercase for Docker registry compatibility
          echo "IMAGE_NAME_LOWER=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - name: 🔑 Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 🔍 Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}
          tags: |
            type=raw,value=${{ env.TAG }}
      - name: 📦 Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: 🛠️ Build Docker Image
        run: |
          TAG=${{ env.TAG }}
          MINA_BRANCH=${{ env.MINA_BRANCH }}
          DUNE_PROFILE=${{ env.DUNE_PROFILE }}
          # MINA_BRANCH_POST_FORK, DUNE_PROFILE_POST_FORK and FORK_CUTOVER_TIME
          # reach build.sh through the workflow-level env: map above; they are
          # deliberately not re-assigned here (free-text values containing spaces
          # would not survive being spliced unquoted into this block).
          IMAGE_NAME=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}
          nix-shell --run "make docker-delegation-verify"
      - name: 🚚 Push Docker Image
        run: docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:${{ env.TAG }}
